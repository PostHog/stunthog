name: Release executables and npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry (for example, v0.1.5)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-15
            target: darwin-arm64
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-2025
            target: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile || bun install --frozen-lockfile
      - run: bun run check
      - run: bun run compile:binary
      - name: Smoke test executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          release/stunthog --no-open --port 3199 --data "$RUNNER_TEMP/stunthog-smoke" &
          pid=$!
          trap 'kill "$pid"' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3199/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Smoke test executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stdout = "$env:RUNNER_TEMP/stunthog.stdout.log"
          $stderr = "$env:RUNNER_TEMP/stunthog.stderr.log"
          $process = Start-Process -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr -FilePath release/stunthog.exe -ArgumentList "--no-open", "--port", "3199", "--data", "$env:RUNNER_TEMP/stunthog-smoke" -PassThru
          try {
            foreach ($attempt in 1..30) {
              if ($process.HasExited) { exit 1 }
              try {
                Invoke-WebRequest http://127.0.0.1:3199/ -TimeoutSec 2 -UseBasicParsing | Out-Null
                exit 0
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            exit 1
          } finally {
            Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
          }
      - name: Package executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mv release/stunthog release/stunthog-${{ matrix.target }}
          tar -C release -czf release/stunthog-${{ matrix.target }}.tar.gz stunthog-${{ matrix.target }}
          shasum -a 256 release/stunthog-${{ matrix.target }}.tar.gz > release/stunthog-${{ matrix.target }}.tar.gz.sha256
      - name: Package executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item release/stunthog.exe release/stunthog-${{ matrix.target }}.exe
          Compress-Archive release/stunthog-${{ matrix.target }}.exe release/stunthog-${{ matrix.target }}.zip
          $hash = (Get-FileHash release/stunthog-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  stunthog-${{ matrix.target }}.zip" | Set-Content release/stunthog-${{ matrix.target }}.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stunthog-${{ matrix.target }}
          path: |
            release/*.tar.gz
            release/*.zip
            release/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: stunthog-*
          merge-multiple: true
      - name: Create release and upload executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber

  package-npm:
    name: Assemble one npm package
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stunthog-*
          path: release
          merge-multiple: true
      - name: Pack launcher and release checksums
        run: |
          GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" bun run package:npm release
          npm pack ./release/npm --pack-destination release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: release/*.tgz
          compression-level: 0
          if-no-files-found: error

  test-npm:
    name: Test npm install on ${{ matrix.os }}
    needs: [publish, package-npm]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15, ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: npm-package
      - name: Install globally and download the executable
        shell: bash
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm-prefix" --foreground-scripts --no-audit --no-fund ./npm-package/*.tgz
          if [ "$RUNNER_OS" = Windows ]; then
            echo "$RUNNER_TEMP/npm-prefix" >> "$GITHUB_PATH"
          else
            echo "$RUNNER_TEMP/npm-prefix/bin" >> "$GITHUB_PATH"
          fi
      - name: Run installed command from PATH
        run: stunthog --help
      - name: Start installed application without source dependencies
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          stunthog --no-open --port 3199 --data "$RUNNER_TEMP/stunthog-installed-smoke" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            kill -0 "$pid" 2>/dev/null || exit 1
            curl --fail --silent http://127.0.0.1:3199/api/evals >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Verify uninstall removes the PATH command
        shell: bash
        run: |
          npm uninstall --global --prefix "$RUNNER_TEMP/npm-prefix" stunthog
          hash -r
          if command -v stunthog; then exit 1; fi

  publish-npm:
    name: Publish to npm with OIDC
    needs: [publish, package-npm, test-npm]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: npm-package
      - name: Publish the tested tarball
        run: |
          tag=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then tag=next; fi
          npm publish ./npm-package/*.tgz --access public --tag "$tag"
